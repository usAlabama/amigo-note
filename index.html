<!DOCTYPE html>
<html lang="en">
<head>

    <title>Notepad   ....🖍</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%233b82f6' rx='14'/><text x='50' y='72' font-size='65' font-weight='700' font-family='system-ui,sans-serif' fill='white' text-anchor='middle'>N</text></svg>">
    <style>
        * { box-sizing: border-box; user-select: auto; }
        :root, html.light {
            --bg-body: #f1f5f9; --card-bg: #ffffff; --toolbar-bg: #f8fafc;
            --border-color: #e2e8f0; --btn-bg: #ffffff; --btn-border: #cbd5e1;
            --btn-text: #0f172a; --btn-hover-bg: #eef2ff; --btn-hover-border: #94a3b8;
            --clear-btn-bg: #fff1f0; --clear-btn-border: #fecaca; --clear-btn-text: #b91c1c;
            --clear-btn-hover-bg: #fee2e2; --status-bg: #f1f5f9; --status-text: #334155;
            --info-text: #475569; --shadow: 0 20px 35px -10px rgba(0,0,0,0.1);
            --editor-bg: #ffffff; --editor-text: #0f172a;
            --tab-active-bg: #3b82f6; --tab-active-text: #ffffff;
        }
        html.dark {
            --bg-body: #0f172a; --card-bg: #1e293b; --toolbar-bg: #0f172a;
            --border-color: #334155; --btn-bg: #1e293b; --btn-border: #475569;
            --btn-text: #e2e8f0; --btn-hover-bg: #334155; --btn-hover-border: #64748b;
            --clear-btn-bg: #2d1a1a; --clear-btn-border: #7f2c2c; --clear-btn-text: #fecaca;
            --clear-btn-hover-bg: #3f2020; --status-bg: #0f172a; --status-text: #cbd5e1;
            --info-text: #94a3b8; --shadow: 0 20px 30px -10px rgba(0,0,0,0.5);
            --editor-bg: #1e293b; --editor-text: #e2e8f0;
            --tab-active-bg: #3b82f6; --tab-active-text: #ffffff;
        }
        html.sepia {
            --bg-body: #f4ecd8; --card-bg: #fef9e6; --toolbar-bg: #faf3e0;
            --border-color: #e2dccd; --btn-bg: #fff8ed; --btn-border: #d4c9b2;
            --btn-text: #5a4a2a; --btn-hover-bg: #fff0db; --btn-hover-border: #c2b39a;
            --clear-btn-bg: #ffefdf; --clear-btn-text: #a1622b; --clear-btn-hover-bg: #ffe6d5;
            --status-bg: #f9f2e2; --status-text: #5a4a2a; --info-text: #7e6b4a;
            --shadow: 0 20px 35px -10px rgba(0,0,0,0.08);
            --editor-bg: #fffdf5; --editor-text: #3e2723;
            --tab-active-bg: #a1622b; --tab-active-text: #ffffff;
        }
        body {
            margin: 0; min-height: 100vh; background: var(--bg-body);
            font-family: system-ui, 'Segoe UI', 'Roboto', sans-serif;
            display: flex; justify-content: center; align-items: center;
            padding: 0.75rem 1.5rem; transition: background 0.3s ease;
        }
        .notepad-card {
            max-width: 1400px; width: 100%; background: var(--card-bg);
            border-radius: 1.5rem; box-shadow: var(--shadow);
            overflow: hidden; transition: background 0.3s ease, box-shadow 0.3s ease;
            display: flex; flex-direction: column; height: 97vh;
        }
        .toolbar, .settings-panel {
            background: var(--toolbar-bg); padding: 0.75rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            display: flex; flex-wrap: wrap; gap: 0.6rem;
            align-items: center; justify-content: space-between; flex-shrink: 0;
            color: var(--info-text);
            transition: background 0.3s, border-color 0.3s, color 0.3s;
        }
        .settings-panel { border-top: 1px solid var(--border-color); font-size: 0.8rem; border-bottom: none; }
        .settings-panel label, .settings-panel span { color: var(--btn-text); transition: color 0.3s; }
        .toolbar-group { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; }
        button, select, input {
            background: var(--btn-bg); border: 1px solid var(--btn-border);
            padding: 0.45rem 0.85rem; border-radius: 2rem; font-size: 0.8rem;
            font-weight: 500; cursor: pointer; transition: all 0.15s ease;
            color: var(--btn-text); font-family: inherit; outline: none;
        }
        button:hover, select:hover { background: var(--btn-hover-bg); border-color: var(--btn-hover-border); transform: translateY(-1px); }
        button:active { transform: translateY(1px); }
        input[type="color"] { padding: 0; width: 30px; height: 30px; border-radius: 50%; overflow: hidden; cursor: pointer; }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: none; border-radius: 50%; }
        .clear-btn { background: var(--clear-btn-bg); border-color: var(--clear-btn-border); color: var(--clear-btn-text); }
        .clear-btn:hover { background: var(--clear-btn-hover-bg); }
        .editor-container { 
            flex: 1; min-height: 0; display: flex; flex-direction: column; 
            padding: 0.5rem 1rem 0.25rem 1rem; overflow: hidden; 
            background: var(--card-bg); transition: background 0.3s;
        }
        .editor-wrapper { display: flex; gap: 1rem; height: 100%; overflow: hidden; }
        .editor-pane {
            flex: 1; display: flex; flex-direction: column; min-width: 0;
            border: 1px solid var(--border-color); border-radius: 1rem;
            overflow: hidden; background: var(--card-bg); transition: border-color 0.3s;
        }
        .editor-header {
            padding: 0.4rem 1rem; font-size: 0.75rem; font-weight: 600;
            color: var(--info-text); background: var(--toolbar-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center;
            transition: background 0.3s, border-color 0.3s, color 0.3s;
        }
        .editor-content {
            flex: 1; padding: 1.2rem 1.5rem; overflow-y: auto;
            font-size: 16px; line-height: 1.6; outline: none;
            font-family: 'Courier New', 'Fira Code', monospace;
            background: var(--editor-bg); color: var(--editor-text);
            white-space: pre-wrap; word-wrap: break-word;
            transition: background 0.3s, color 0.3s;
        }
        .editor-content:empty:before { content: attr(data-placeholder); color: var(--info-text); opacity: 0.6; }
        .editor-content:focus { box-shadow: inset 0 0 0 2px var(--btn-hover-border); }
        .editor-content b, .editor-content strong { font-weight: bold; }
        .editor-content i, .editor-content em { font-style: italic; }
        .editor-content u { text-decoration: underline; }
        .editor-content s, .editor-content strike { text-decoration: line-through; }
        .editor-content code { background: rgba(128,128,128,0.15); padding: 0.15em 0.4em; border-radius: 4px; font-family: monospace; font-size: 0.95em; }
        .editor-content .hidden { background: var(--editor-text); color: var(--editor-text); padding: 0 3px; border-radius: 3px; cursor: help; user-select: none; }
        .editor-content .hidden:hover { color: var(--btn-hover-border); background: transparent; }
        .editor-content blockquote { border-left: 4px solid var(--btn-hover-border); margin: 0.5em 0; padding: 0.4em 1em; color: var(--info-text); background: rgba(128,128,128,0.05); border-radius: 0 0.4rem 0.4rem 0; }
        .editor-content a { color: #3b82f6; text-decoration: none; }
        .editor-content a:hover { text-decoration: underline; }
        
        /* ———————— SHEET TABS SYSTEM STYLES ———————— */
        .tabs-container {
            display: flex; align-items: center; background: var(--toolbar-bg);
            border-top: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color);
            padding: 0.2rem 1rem; gap: 0.25rem; flex-shrink: 0; min-height: 34px;
            transition: background 0.3s, border-color 0.3s;
        }
        .tabs-scroll-area {
            display: flex; gap: 0.25rem; flex: 1; overflow-x: auto;
            scrollbar-width: none; /* Firefox */
        }
        .tabs-scroll-area::-webkit-scrollbar { display: none; /* Chrome/Safari */ }
        .tab-button {
            display: inline-flex; align-items: center; gap: 0.4rem;
            padding: 0.25rem 0.75rem; border-radius: 0.5rem; border: 1px solid var(--btn-border);
            background: var(--btn-bg); color: var(--btn-text); font-size: 0.75rem;
            max-width: 150px; min-width: 60px; white-space: nowrap; overflow: hidden;
            text-overflow: ellipsis; flex: 1 1 auto; justify-content: space-between;
            transition: all 0.15s ease;
        }
        .tab-button.active {
            background: var(--tab-active-bg); color: var(--tab-active-text);
            border-color: var(--tab-active-bg); font-weight: bold;
        }
        .tab-close {
            display: inline-flex; align-items: center; justify-content: center;
            width: 14px; height: 14px; border-radius: 50%; font-size: 10px;
            cursor: pointer; opacity: 0.6; transition: opacity 0.15s, background 0.15s;
        }
        .tab-close:hover { opacity: 1; background: rgba(128,128,128,0.3); }
        .add-tab-btn {
            padding: 0.2rem 0.6rem; border-radius: 0.5rem; font-weight: bold;
            font-size: 0.85rem; flex-shrink: 0;
        }
        /* —————————————————————————————————————————— */

        .dropdown { position: relative; display: inline-block; }
        .dropdown-content {
            display: none; position: absolute; top: calc(100% + 5px); right: 0;
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 0.75rem; padding: 0.7rem; min-width: 260px;
            max-height: 220px; overflow-y: auto; box-shadow: var(--shadow);
            z-index: 100; grid-template-columns: repeat(8, 1fr); gap: 0.3rem;
        }
        .dropdown-content.show { display: grid; animation: fadeIn 0.15s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
        .dropdown-item {
            cursor: pointer; padding: 0.25rem; text-align: center;
            border-radius: 4px; font-size: 1.2rem; transition: 0.1s; user-select: none; color: var(--btn-text);

        .dropdown-item:hover { background: var(--btn-hover-bg); transform: scale(1.15); }

            @keyframes fadeInCenter { from { opacity: 0; transform: translateX(-50%) translateY(-5px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        }
    </style>

        <div class="toolbar-group">
            <button id="copyBtn">📄 Copy</button>

                <option value="json">.json</option>

            <button id="saveBtn">💾 Save</button>
            <select id="interfaceLang" title="Interface language" style="margin-left:0.5rem;">

            <label style="font-size:0.8rem; display:flex; align-items:center; gap:0.3rem; margin-left: 0.5rem; cursor: pointer;">

        <button id="resetAllSettings" class="clear-btn" style="font-size:0.6rem; margin-left:auto;">⚙️ Reset Settings</button>

    <div class="editor-container">
        <div class="editor-wrapper" id="editorWrapper">
            <div class="editor-pane">
                <div class="editor-header">
                    <span id="hdrDraft">📝 Draft</span>
                    <span id="counter1" style="font-size:0.75rem;">0 symbols</span>

                <div id="notesArea" class="editor-content" contenteditable="true" 
                     spellcheck="true" lang="en" data-placeholder="Write here... Format with the buttons or insert symbols."></div>

                     spellcheck="true" lang="en" data-placeholder="Final version..."></div>

    </div>

        <span id="mainCounter" style="font-weight: bold;">0 total symbols</span>
    </div>
</div>

                let g = parseInt(hex.slice(3,5), 16) / 255;
                let b = parseInt(hex.slice(5,7), 16) / 255;

        if (type==='quote') { document.execCommand('formatBlock',false,'blockquote'); return; } 
        if (type==='monospace') { document.execCommand('fontName',false,'monospace'); return; }

    /* ———————— SHEET TABS LOGIC ENGINE ———————— */
    function initPagesSystem() {
        try {
            const stored = localStorage.getItem(STORAGE_KEYS.pagesData);
            if (stored) { pages = JSON.parse(stored); }
        } catch(e) { pages = []; }

        if (!pages || pages.length === 0) {
            const firstPageId = 'page_' + Date.now();
            pages = [{
                id: firstPageId,
                name: 'Draft',
                html1: `## Hello, Amigo! 👋\n\nThis is a **smart notepad** with:\n- ✅ Visual formatting\n- 🎨 Custom background + auto-contrast\n- 💾 Export to .txt/.md/.js/.html/.json\n- 🔀 Split view (draft/cleanup)\n- 😊 Huge emoji & symbols library`,
                html2: ''
            }];
            settings.activePageId = firstPageId;
        }
        if (!settings.activePageId || !pages.find(p => p.id === settings.activePageId)) {
            settings.activePageId = pages[0].id;
        }
    }

    function createNewPage() {
        const lang = settings.interfaceLang || 'en';
        const t = I18N[lang] || I18N.en;
        const newId = 'page_' + Date.now();
        const newPage = { id: newId, name: t.defaultTabName, html1: '', html2: '' };
        pages.push(newPage);
        savePagesData();
        switchPage(newId);
    }

    function switchPage(id) {
        // Saving the content of the currently active page before switching
        const curPage = pages.find(p => p.id === settings.activePageId);
        if (curPage) { curPage.html1 = els.ed1.innerHTML; curPage.html2 = els.ed2.innerHTML; }

        settings.activePageId = id;
        saveSettings();

        const targetPage = pages.find(p => p.id === id);
        if (targetPage) {
            els.ed1.innerHTML = targetPage.html1;
            els.ed2.innerHTML = targetPage.html2;
        }
        
        renderTabs();
        updateCounters();
        els.ed1.focus();
    }

    function deletePage(id, event) {
        event.stopPropagation();
        if (pages.length <= 1) return; // Cannot delete a single tab

        const index = pages.findIndex(p => p.id === id);
        pages = pages.filter(p => p.id !== id);

        if (settings.activePageId === id) {
            const nextActiveIndex = index > 0 ? index - 1 : 0;
            settings.activePageId = pages[nextActiveIndex].id;
        }

        savePagesData();
        saveSettings();
        switchPage(settings.activePageId);
    }

    function updateCurrentPageName() {
        const curPage = pages.find(p => p.id === settings.activePageId);
        if (!curPage) return;

        const plainText = els.ed1.innerText.trim();
        const lang = settings.interfaceLang || 'en';
        const t = I18N[lang] || I18N.en;

        if (!plainText) {
            curPage.name = t.defaultTabName;
        } else {
            // Take the first words or part of a string up to 18 characters to keep the button compact
            let words = plainText.split(/\s+/).slice(0, 3).join(' ');
            if (words.length > 15) words = words.substring(0, 15) + '...';
            curPage.name = words || t.defaultTabName;
        }
        
        // Quickly updating the name of only the active tab in the DOM without re-rendering the entire tree
        const activeTabEl = document.querySelector(`.tab-button[data-id="${settings.activePageId}"] .tab-text`);
        if (activeTabEl) activeTabEl.textContent = curPage.name;
    }

    function renderTabs() {
        els.tabsContainer.innerHTML = '';
        pages.forEach(p => {
            const btn = document.createElement('div');
            btn.className = `tab-button ${p.id === settings.activePageId ? 'active' : ''}`;
            btn.setAttribute('data-id', p.id);
            
            const txtSpan = document.createElement('span');
            txtSpan.className = 'tab-text';
            txtSpan.textContent = p.name;
            btn.appendChild(txtSpan);

            // Delete tab button ("x") if there is more than one tab
            if (pages.length > 1) {
                const closeSpan = document.createElement('span');
                closeSpan.className = 'tab-close';
                closeSpan.innerHTML = '✕';
                closeSpan.onclick = (e) => deletePage(p.id, e);
                btn.appendChild(closeSpan);
            }

            btn.onclick = () => switchPage(p.id);
            els.tabsContainer.appendChild(btn);
        });
        
        // Automatic scrolling after the active tab
        const activeTab = els.tabsContainer.querySelector('.tab-button.active');
        if (activeTab) { activeTab.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
    }

    function savePagesData() { localStorage.setItem(STORAGE_KEYS.pagesData, JSON.stringify(pages)); }

    function loadSettings() { 
        try { const s=localStorage.getItem(STORAGE_KEYS.settings); if(s) settings={...DEFAULT_SETTINGS,...JSON.parse(s)}; } catch(e){}

        els.themeSelect.value=settings.theme;

    function saveSettings() { localStorage.setItem(STORAGE_KEYS.settings, JSON.stringify(settings)); }
    
    function autoSave() { 
        const curPage = pages.find(p => p.id === settings.activePageId);
        if (curPage) {
            curPage.html1 = els.ed1.innerHTML;
            if (els.ed2) curPage.html2 = els.ed2.innerHTML;
        }
        updateCurrentPageName();
        savePagesData();
        updateCounters(); 
    }
    
    function loadContent() { 
        const curPage = pages.find(p => p.id === settings.activePageId);
        if (curPage) {
            els.ed1.innerHTML = curPage.html1;
            els.ed2.innerHTML = curPage.html2 || '';
        }
        const lang=settings.interfaceLang||'en'; 
        els.ed2.dataset.placeholder = I18N[lang]?.ph2||'Final version...'; 
        els.ed1.dataset.placeholder = I18N[lang]?.ph1||'Write here...'; 
        renderTabs();
        updateCounters(); 
    }
    
    function saveFile() {

    function initMenus() {

        document.onclick=()=>document.querySelectorAll('.dropdown-content').forEach(m=>m.classList.remove('show')); 
    }

    const syncScroll = e => { const t = e.target === els.ed1 ? els.ed2 : els.ed1; if (t) t.scrollTop = e.target.scrollTop; };

    function toggleSplitView(force) { 
        settings.splitMode = force!==undefined?force:!settings.splitMode; 
        els.pane2.style.display = settings.splitMode?'flex':'none'; 
        const lang=settings.interfaceLang||'en'; 
        els.splitBtn.textContent = settings.splitMode?I18N[lang].merge:I18N[lang].split; 
        els.splitBtn.title = els.splitBtn.textContent; 
        const m = settings.splitMode ? 'addEventListener' : 'removeEventListener'; 
        els.ed1[m]('scroll', syncScroll); if(els.ed2) els.ed2[m]('scroll', syncScroll); 
        saveSettings(); updateCounters(); 
    }
    
    function setFontSize(v) { settings.fontSize=Math.max(10,Math.min(32,v)); [els.ed1,els.ed2].forEach(e=>{if(e)e.style.fontSize=`${settings.fontSize}px`}); els.fontVal.textContent=`${settings.fontSize}px`; saveSettings(); }

    document.querySelectorAll('[data-fmt]').forEach(b => {
        b.addEventListener('mousedown', e => e.preventDefault());
        b.onclick=e=>applyFormat(e.currentTarget.dataset.fmt);
    });
    
    [els.ed1,els.ed2].forEach(e=>{if(e){e.onfocus=()=>activeEditor=e; e.oninput=autoSave;}}); 
    els.saveBtn.onclick=saveFile; 
    els.spellLang.onchange=e=>{[els.ed1,els.ed2].forEach(ed=>ed.lang=e.target.value); activeEditor.blur();activeEditor.focus();}; 
    els.splitBtn.onclick=()=>toggleSplitView(); 
    els.themeSelect.onchange=e=>{settings.theme=e.target.value;if(settings.theme==='custom')els.themeColor.value=settings.customThemeColor||'#10b981';applyTheme(settings.theme,settings.customThemeColor);saveSettings();}; 
    els.themeColor.oninput=e=>{settings.theme='custom';settings.customThemeColor=e.target.value;els.themeSelect.value='custom';applyTheme('custom',settings.customThemeColor);saveSettings();}; 
    els.dialogColor.oninput=e=>{settings.dialogColor=e.target.value;applyTheme(settings.theme,settings.customThemeColor);saveSettings();}; 
    els.fontP.onclick=()=>setFontSize(settings.fontSize+2); 
    els.fontM.onclick=()=>setFontSize(settings.fontSize-2); 
    els.fontR.onclick=()=>setFontSize(DEFAULT_SETTINGS.fontSize); 
    els.addTabBtn.onclick=createNewPage;
    
    els.resetAll.onclick=()=>{
        const lang = settings.interfaceLang || 'en';
        if(confirm(I18N[lang].msgReset)){
            settings={...DEFAULT_SETTINGS};
            localStorage.setItem(STORAGE_KEYS.settings, JSON.stringify(settings));
            document.documentElement.style.cssText='';
            loadSettings();
            loadContent();
        }
    }; 
    
    els.copyBtn.onclick=async()=>{try{await navigator.clipboard.writeText(settings.splitMode?`=== DRAFT ===\n${els.ed1.innerText}\n\n=== CLEANUP ===\n${els.ed2.innerText}`:els.ed1.innerText);const o=els.copyBtn.textContent;els.copyBtn.textContent='✅ Copied!';setTimeout(()=>els.copyBtn.textContent=o,1500);}catch{alert('❌ Copy failed');}}; 
    
    els.clearBtn.onclick=()=>{
        const lang = settings.interfaceLang || 'en';
        if(activeEditor.innerText.trim() && confirm(I18N[lang].msgClear)){
            activeEditor.innerHTML='';
            autoSave();
            activeEditor.focus();
        }
    }; 
    
    els.interfaceLang.onchange=e=>applyLanguage(e.target.value);

    initMenus(); loadSettings(); loadContent(); els.ed1.focus();
</script>
</body>
</html>
